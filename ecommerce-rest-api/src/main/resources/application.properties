# ============================================================
# APPLICATION
# ============================================================

spring.application.name=ecommerce-rest-api
server.port=8080


# ============================================================
# DATABASE - MYSQL
# ============================================================

spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ============================================================
# JPA / HIBERNATE
# ============================================================

# Automatically create/update tables based on your entities
spring.jpa.hibernate.ddl-auto=update

# Show SQL in console
spring.jpa.show-sql=false

# Format generated SQL
spring.jpa.properties.hibernate.format_sql=true

# Add Hibernate comments to SQL
spring.jpa.properties.hibernate.use_sql_comments=true

# JDBC batch processing
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Disable Open Session in View warning
spring.jpa.open-in-view=false


# ============================================================
# LOGGING
# ============================================================

logging.level.root=INFO
logging.level.com.example.ecommerce=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO

# Log file
logging.file.name=logs/ecommerce-rest-api.log


# ============================================================
# JACKSON / JSON
# ============================================================

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.indent-output=true


# ============================================================
# ACTUATOR
# ============================================================

management.endpoints.web.exposure.include=health,info,metrics,loggers
management.endpoint.health.show-details=always


# ============================================================
# SWAGGER / OPENAPI
# ============================================================

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs


# ============================================================
# FILE UPLOAD
# ============================================================

file.upload.dir=uploads/products/

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


# ============================================================
# SCHEDULER
# ============================================================

# Order cancellation scheduler - 5 minutes
app.scheduler.order-cancellation-rate=300000

# Cart cleanup scheduler - 5 minutes
app.scheduler.cart-cleanup-rate=300000