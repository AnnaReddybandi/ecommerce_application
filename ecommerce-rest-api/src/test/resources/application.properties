# Test configuration using in-memory H2 database
spring.application.name=ecommerce-rest-api-test

spring.datasource.url=jdbc:h2:mem:ecommerce_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

logging.level.root=WARN
logging.level.com.example.ecommerce=INFO

file.upload.dir=target/test-uploads/

app.scheduler.order-cancellation-rate=300000
app.scheduler.cart-cleanup-rate=300000
